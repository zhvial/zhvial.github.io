<script type="module">
import init, * as bindings from './solidcraft-web-460a1b905b124e19.js';
// zhvial.github.io: GitHub refuses files over 100 MB, so the wasm is stored gzipped. It is unpacked
// here and checked against the release's integrity hash before it runs.
async function loadWasm() {
  const res = await fetch('./solidcraft-web-460a1b905b124e19_bg.wasm.gz');
  if (!res.ok) throw new Error(`solidcraft-web-460a1b905b124e19_bg.wasm.gz: HTTP ${res.status}`);
  let bytes = new Uint8Array(await res.arrayBuffer());
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    const unpacked = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes = new Uint8Array(await new Response(unpacked).arrayBuffer());
  }
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-384', bytes));
  if ('sha384-' + btoa(String.fromCharCode(...digest)) !== 'sha384-vOVtl65LJIc1j78azV72yS7EvrZxlT4sKeOEBKnKVMAODlYpyh0s1diwItTJLA+R') throw new Error('SolidCraft wasm failed its integrity check');
  return bytes;
}
let wasm;
try {
  wasm = await init({ module_or_path: await loadWasm() });
} catch (e) {
  const status = document.getElementById('solidcraft_loading');
  if (status) status.textContent = 'SolidCraft could not start: ' + e.message;
  throw e;
}


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

<link rel="modulepreload" href="./solidcraft-web-460a1b905b124e19.js" crossorigin="anonymous" integrity="sha384-8ImzFlLCDgheMyqIaYOK7h+u44wMQAfKP1ogZT+SwOUv67UW3drxUcRITuPFwmBQ"></head>
<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading SolidCraft&hellip;</span></div>
  <script>
    // zhvial.github.io: no service worker (offline use needs the plain .wasm); sw.js only retires an old one.
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
  </script>
</body>
